{% extends "layout.html" %}

{% block title %}Logowanie{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-box-arrow-in-right"></i> Logowanie</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('login') }}">
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Hasło</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Zaloguj się</button>
                    </div>
                </form>
                
                <hr>
                
                <div class="text-center">
                    <h6>Dane testowe:</h6>
                    <div class="small">
                        <p><strong>Klient:</strong> klient@example.com / klient123</p>
                        <p><strong>Kelner:</strong> kelner@example.com / kelner123</p>
                        <p><strong>Menadżer:</strong> manager@example.com / manager123</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
