<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ResNow - {% block title %}Klient{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header safe-area-top">
        <div class="header-title">
            <i class="fas fa-utensils"></i>
            ResNow
        </div>
        <div class="header-actions">
            <button class="header-btn" onclick="toggleNotifications()">
                <i class="fas fa-bell"></i>
                <span class="badge" id="notificationBadge" style="display: none;">3</span>
            </button>
            <a href="{{ url_for('client_profile') }}" class="header-btn">
                <i class="fas fa-user"></i>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main safe-area-bottom">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="toast">
                        <i class="fas fa-{% if category == 'success' %}check-circle{% else %}exclamation-circle{% endif %}"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <!-- Fixed Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="{{ url_for('client_dashboard') }}"
           class="bottom-nav-item {% if request.endpoint == 'client_dashboard' %}active{% endif %}"
           id="navHome">
            <i class="fas fa-home bottom-nav-icon"></i>
            <span class="bottom-nav-label">Start</span>
        </a>
        <a href="{{ url_for('client_restaurants') }}"
           class="bottom-nav-item {% if request.endpoint == 'client_restaurants' %}active{% endif %}"
           id="navRestaurants">
            <i class="fas fa-store bottom-nav-icon"></i>
            <span class="bottom-nav-label">Restauracje</span>
        </a>
        <a href="{{ url_for('client_search') }}"
           class="bottom-nav-item {% if request.endpoint == 'client_search' %}active{% endif %}"
           id="navSearch">
            <i class="fas fa-search bottom-nav-icon"></i>
            <span class="bottom-nav-label">Szukaj</span>
        </a>
        <a href="{{ url_for('client_cart') }}"
           class="bottom-nav-item {% if request.endpoint == 'client_cart' %}active{% endif %}"
           id="navCart">
            <i class="fas fa-shopping-cart bottom-nav-icon"></i>
            <span class="bottom-nav-label">Koszyk</span>
            <span class="badge badge-danger" id="cartBadge" style="display: none;">0</span>
        </a>
        <a href="{{ url_for('client_profile') }}"
           class="bottom-nav-item {% if request.endpoint == 'client_profile' %}active{% endif %}"
           id="navProfile">
            <i class="fas fa-user bottom-nav-icon"></i>
            <span class="bottom-nav-label">Profil</span>
        </a>
    </nav>

    <!-- JavaScript -->
    <script>
        // Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/js/sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.log('Service Worker Error:', err));
        }

        // Toast auto-hide
        setTimeout(() => {
            const toasts = document.querySelectorAll('.toast');
            toasts.forEach(toast => {
                toast.style.transition = 'opacity 0.3s';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            });
        }, 3000);

        function toggleNotifications() {
            // Tutaj możesz dodać modal z powiadomieniami
            const badge = document.getElementById('notificationBadge');
            if (badge.style.display === 'none') {
                badge.style.display = 'inline-flex';
            } else {
                badge.style.display = 'none';
            }
        }

        // Update cart badge from localStorage
        function updateCartBadge() {
            let totalItems = 0;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('cart_')) {
                    try {
                        const cart = JSON.parse(localStorage.getItem(key) || '[]');
                        totalItems += cart.reduce((sum, item) => sum + item.quantity, 0);
                    } catch (e) {
                        console.error('Error parsing cart:', e);
                    }
                }
            }

            const badge = document.getElementById('cartBadge');
            if (totalItems > 0) {
                badge.textContent = totalItems;
                badge.style.display = 'inline-flex';
            } else {
                badge.style.display = 'none';
            }
        }

        // Check cart on page load
        document.addEventListener('DOMContentLoaded', updateCartBadge);

        // Add active class to bottom nav based on current page
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname;
            const navItems = document.querySelectorAll('.bottom-nav-item');

            navItems.forEach(item => {
                item.classList.remove('active');
            });

            // Set active based on URL
            if (currentPath.includes('/client/dashboard')) {
                document.getElementById('navHome').classList.add('active');
            } else if (currentPath.includes('/client/restaurants')) {
                document.getElementById('navRestaurants').classList.add('active');
            } else if (currentPath.includes('/client/search')) {
                document.getElementById('navSearch').classList.add('active');
            } else if (currentPath.includes('/client/cart')) {
                document.getElementById('navCart').classList.add('active');
            } else if (currentPath.includes('/client/profile')) {
                document.getElementById('navProfile').classList.add('active');
            }
        });

        {% block extra_js %}{% endblock %}
    </script>
</body>
</html>
